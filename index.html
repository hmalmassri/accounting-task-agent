<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكيل المهام الذكي - شركة المحاسبة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            // البيانات الأساسية المستخرجة من الملف
            const stats = {
                totalEmployees: 40,
                totalDepartments: 10,
                totalTasks: 101,
                completedTasks: 67,
                inProgressTasks: 11,
                delayedTasks: 23,
                avgCompletion: 85.6,
                totalAbsenceDays: 14,
                totalLateMinutes: 3906
            };

            const departments = [
                { name: 'الإدارة العليا', staff: 2, tasks: 4, completed: 3, rate: 75.0, late: 109, abs: 1 },
                { name: 'الموارد البشرية', staff: 3, tasks: 6, completed: 4, rate: 66.7, late: 336, abs: 2 },
                { name: 'المالية والمحاسبة', staff: 5, tasks: 12, completed: 8, rate: 66.7, late: 709, abs: 0 },
                { name: 'التشغيل', staff: 9, tasks: 32, completed: 23, rate: 71.9, late: 995, abs: 7 },
                { name: 'المبيعات', staff: 6, tasks: 14, completed: 8, rate: 57.1, late: 844, abs: 1 },
                { name: 'تقنية المعلومات', staff: 3, tasks: 10, completed: 8, rate: 80.0, late: 185, abs: 0 },
                { name: 'التسويق', staff: 3, tasks: 8, completed: 6, rate: 75.0, late: 322, abs: 0 },
                { name: 'خدمة العملاء', staff: 4, tasks: 9, completed: 5, rate: 55.6, late: 410, abs: 2 },
                { name: 'الشؤون القانونية', staff: 2, tasks: 4, completed: 2, rate: 50.0, late: 95, abs: 1 },
                { name: 'التدقيق الداخلي', staff: 3, tasks: 2, completed: 0, rate: 0.0, late: 50, abs: 0 }
            ];

            return (
                <div className="p-6 max-w-7xl mx-auto space-y-6">
                    {/* الهيدر */}
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl gap-4">
                        <div>
                            <div className="flex items-center gap-3">
                                <i className="fa-solid fa-robot text-emerald-400 text-3xl"></i>
                                <h1 className="text-2xl font-bold text-white">وكيل المهام الذكي | Smart Task Agent</h1>
                            </div>
                            <p className="text-slate-400 text-sm mt-1">نظام متابعة دوام وإنجاز 40 موظفاً وتقديم التقارير اليومية للإدارة العليا</p>
                        </div>
                        <div className="flex items-center gap-3 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700">
                            <i className="fa-regular fa-calendar text-emerald-400"></i>
                            <span className="text-sm font-semibold text-slate-300">التقرير اليومي: 30 سبتمبر 2026</span>
                        </div>
                    </header>

                    {/* بطاقات المؤشرات الأساسية */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                            <div className="flex justify-between items-center text-slate-400 mb-2">
                                <span className="text-sm">نسبة الإنجاز الكلية</span>
                                <i className="fa-solid fa-chart-line text-emerald-400"></i>
                            </div>
                            <div className="text-3xl font-extrabold text-emerald-400">{stats.avgCompletion}%</div>
                            <p className="text-xs text-slate-500 mt-2">67 من أصل 101 مهمة مكتملة</p>
                        </div>

                        <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                            <div className="flex justify-between items-center text-slate-400 mb-2">
                                <span className="text-sm">المهام المتأخرة</span>
                                <i className="fa-solid fa-triangle-exclamation text-rose-400"></i>
                            </div>
                            <div className="text-3xl font-extrabold text-rose-400">{stats.delayedTasks}</div>
                            <p className="text-xs text-slate-500 mt-2">تتطلب تذكيراً وتدخل الإدارة</p>
                        </div>

                        <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                            <div className="flex justify-between items-center text-slate-400 mb-2">
                                <span className="text-sm">إجمالي الموظفين</span>
                                <i className="fa-solid fa-users text-blue-400"></i>
                            </div>
                            <div className="text-3xl font-extrabold text-white">{stats.totalEmployees}</div>
                            <p className="text-xs text-slate-500 mt-2">موزعين على 10 أقسام</p>
                        </div>

                        <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                            <div className="flex justify-between items-center text-slate-400 mb-2">
                                <span className="text-sm">الالتزام بالدوام</span>
                                <i className="fa-solid fa-clock text-amber-400"></i>
                            </div>
                            <div className="text-3xl font-extrabold text-amber-400">{stats.totalAbsenceDays} أيام غياب</div>
                            <p className="text-xs text-slate-500 mt-2">{stats.totalLateMinutes} دقيقة تأخير إجمالية</p>
                        </div>
                    </div>

                    {/* ملخص الذكاء الاصطناعي والتوصيات */}
                    <div className="bg-slate-800/90 p-6 rounded-2xl border border-emerald-500/30 shadow-lg">
                        <div className="flex items-center gap-2 mb-3 text-emerald-400">
                            <i className="fa-solid fa-brain text-xl"></i>
                            <h2 className="text-lg font-bold">ملخص الذكاء الاصطناعي والتوصيات اليومية</h2>
                        </div>
                        <ul className="space-y-2 text-slate-300 text-sm list-disc list-inside">
                            <li>سجلت الأقسام التشغيلية والتقنية أعلى معدلات إنجاز للمهام بنسبة وصلت إلى 80%.</li>
                            <li>قسم <strong className="text-rose-300">التدقيق الداخلي</strong> يحتاج إعادة توزيع مهام حيث تبين وجود مهمتين متأخرتين بنسبة إنجاز 0%.</li>
                            <li>تركزت أغلب دقائق التأخير في قسمي <strong className="text-amber-300">التشغيل (995 دقيقة)</strong> و <strong className="text-amber-300">المبيعات (844 دقيقة)</strong>.</li>
                        </ul>
                    </div>

                    {/* جدول الأقسام */}
                    <div className="bg-slate-800 rounded-2xl border border-slate-700 p-6">
                        <h2 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                            <i className="fa-solid fa-table-list text-emerald-400"></i>
                            تقرير متابعة الأقسام المباشر
                        </h2>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right text-sm">
                                <thead className="bg-slate-900/60 text-slate-400 border-b border-slate-700">
                                    <tr>
                                        <th className="p-3">القسم</th>
                                        <th className="p-3">عدد الموظفين</th>
                                        <th className="p-3">إجمالي المهام</th>
                                        <th className="p-3">المكتملة</th>
                                        <th className="p-3">نسبة الإنجاز</th>
                                        <th className="p-3">أيام الغياب</th>
                                        <th className="p-3">دقائق التأخير</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700">
                                    {departments.map((dept, index) => (
                                        <tr key={index} className="hover:bg-slate-700/50 transition">
                                            <td className="p-3 font-semibold text-white">{dept.name}</td>
                                            <td className="p-3">{dept.staff}</td>
                                            <td className="p-3">{dept.tasks}</td>
                                            <td className="p-3 text-emerald-400 font-bold">{dept.completed}</td>
                                            <td className="p-3">
                                                <div className="flex items-center gap-2">
                                                    <div className="w-16 bg-slate-700 h-2 rounded-full overflow-hidden">
                                                        <div className="bg-emerald-400 h-full" style={{width: `${dept.rate}%`}}></div>
                                                    </div>
                                                    <span>{dept.rate}%</span>
                                                </div>
                                            </td>
                                            <td className="p-3 text-amber-400">{dept.abs}</td>
                                            <td className="p-3 text-slate-300">{dept.late} دقيقة</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
